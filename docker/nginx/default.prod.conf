# Config de producao: diferente de default.conf (dev), o Nginx aqui NAO tem
# acesso ao codigo do backend no seu proprio filesystem (nao ha bind mount
# compartilhado - o codigo vive dentro da imagem do container "backend").
# Por isso nao da pra usar try_files pra checar se public/index.php existe
# antes de repassar pro PHP-FPM. Como esta API nao serve nenhum arquivo
# estatico proprio (nenhum asset publico do Laravel), toda requisicao vai
# direto pro FastCGI, com SCRIPT_FILENAME fixo apontando pro index.php que
# existe no filesystem do container "backend" (o unico lado que importa
# pro FastCGI resolver o caminho).
server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    location / {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;
    }
}
