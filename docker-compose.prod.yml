# Compose de producao: usa as imagens ja construidas e publicadas no GHCR
# pelo workflow de CD (nao builda nada aqui), sem bind mounts do
# codigo-fonte, com MySQL sem porta exposta publicamente.
services:
  backend:
    image: ghcr.io/fabianofaria/php_interview_project_api_cep-backend:latest
    container_name: cep_backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      - mysql
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: cep_nginx
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app

  frontend:
    image: ghcr.io/fabianofaria/php_interview_project_api_cep-frontend:latest
    container_name: cep_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - app

  mysql:
    image: mysql:8.0
    container_name: cep_mysql
    restart: unless-stopped
    env_file:
      - ./mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  backend_storage:
  mysql_data:
