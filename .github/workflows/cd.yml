name: CD - Deploy to VPS

# Dispara depois que o workflow "CI" (.github/workflows/ci.yml) terminar de
# rodar na main - nao usa um check-name fixo porque isso quebra toda vez
# que o nome de um job do CI muda. Cobre os dois jobs do CI (backend e
# frontend) automaticamente, sem precisar listar cada um aqui.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/php/Dockerfile.prod
            build_args: ""
          - name: frontend
            dockerfile: docker/frontend/Dockerfile.prod
            build_args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Normalizar nome do owner para minusculas (exigido pelo GHCR)
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/php_interview_project_api_cep-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER_LC }}/php_interview_project_api_cep-${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # So roda quando os secrets da VPS ja estiverem configurados. Ate la,
    # o job aparece como "skipped" (nao quebra o pipeline em vermelho) -
    # remova esta condicao quando VPS_HOST etc. estiverem cadastrados em
    # Settings > Secrets and variables > Actions.
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.VPS_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Materializa os arquivos de ambiente da VPS a partir de secrets do
      # GitHub Actions - nunca ficam versionados no repositorio. Ajuste os
      # nomes dos secrets conforme forem cadastrados.
      - name: Gerar arquivos de ambiente
        run: |
          cat > backend.env <<EOF
          APP_NAME="Cadastro de Clientes API"
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=${{ secrets.APP_KEY }}
          APP_URL=${{ vars.API_URL }}
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=${{ secrets.MYSQL_DATABASE }}
          DB_USERNAME=${{ secrets.MYSQL_USER }}
          DB_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          CACHE_STORE=database
          SESSION_DRIVER=database
          QUEUE_CONNECTION=database
          CORS_ALLOWED_ORIGINS=${{ vars.FRONTEND_URL }}
          EOF
          cat > mysql.env <<EOF
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          EOF

      - name: Copiar arquivos de configuracao para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,docker/nginx/default.prod.conf,backend.env,mysql.env"
          target: "/opt/php_interview_project_api_cep"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/php_interview_project_api_cep
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force
            docker image prune -f
